name: Deploy

# Every push to main produces a ready-to-run release on the `deploy` branch: the source, the PHP
# dependencies (installed for production) and the compiled client and SSR bundles. The host's own
# Git integration pulls that branch, and pulling is the whole deployment — nothing is installed or
# compiled on the host. It is shared hosting: a build there once exhausted the account's process
# limit and took every site on it offline.
#
# Optional: set the repository variable SSH_RELEASE=true (plus the SSH_* and DB_* secrets) to also
# run deploy/remote.sh on the host after each release — migrations, caches, SSR restart.

on:
  push:
    branches: [main]
    # A push of documentation or tests alone changes nothing the host runs (D-148).
    paths-ignore: ['docs/**', '*.md', 'tests/**', 'e2e/**']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: PHP dependencies (production only)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
          # Documentation is never read at runtime, and some of it is not safe to publish:
          # stripe-php's README carries a sample test key that GitHub's push protection rightly
          # refuses. The release ships code only.
          find vendor -type f -iname '*.md' -delete

      # The reset's baseline is the schema this release migrates to (the operator's brief of 05.10.2026, §2.1): asked of
      # the files alone, and only when a migration is not in it yet built afresh — on the host's engine, as CI starts it
      # (suite.yml) — and shipped with the release. With dev packages for the seeders, then back to production's.
      - name: Reset baseline (rebuilt when a migration is not in it)
        run: |
          if php artisan rimify:reset-baseline --check; then exit 0; fi
          composer install --no-interaction --no-progress --prefer-dist
          docker run -d --name baseline-db -p 3306:3306 -e MARIADB_ROOT_PASSWORD=root mariadb:11.8.9 \
            --sql-mode=NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci --innodb-strict-mode=OFF --max-allowed-packet=1G
          for i in $(seq 1 60); do
            if docker exec baseline-db healthcheck.sh --connect --innodb_initialized > /dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec baseline-db mariadb -uroot -proot -e 'CREATE DATABASE rimify_baseline CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          APP_ENV=local APP_KEY="base64:$(openssl rand -base64 32)" DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 \
            DB_DATABASE=rimify_baseline DB_USERNAME=root DB_PASSWORD=root CACHE_STORE=array SESSION_DRIVER=array \
            php artisan rimify:reset-baseline
          php artisan rimify:reset-baseline --check
          docker rm -f baseline-db > /dev/null
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
          find vendor -type f -iname '*.md' -delete
          echo "::notice title=Reset baseline::rebuilt on MariaDB 11.8.9 for this release"

      - name: Node dependencies
        run: npm ci --no-audit --no-fund

      # The Fahrzeugschein scan runs on the customer's device from our own origin: the worker,
      # the WebAssembly cores and the German language data are shipped with the release.
      - name: OCR assets
        run: npm run ocr:assets

      # The demo catalogue's cut-outs are rendered here from the free-licence photographs named in
      # the seed map, so neither the photographs nor 77 MB of derived images live in the repository.
      - name: Demo wheel imagery
        run: |
          php artisan wheels:fetch-photos
          php artisan wheels:process-images

      - name: 3D assets
        run: npm run 3d:assets

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Build client and SSR bundles
        run: npm run build

      # Which build this is: a test environment prints it at the foot of every page (App\Support\ReleaseStamp), so a
      # reviewer can tell a new version from an old one without asking.
      - name: Release stamp
        run: printf '{"commit":"%s","built":"%s"}\n' "${GITHUB_SHA::8}" "$(date -u +%FT%TZ)" > public/build/release.json

      # The release is main plus vendor/ and the compiled assets, committed on top of the previous
      # release so the host always pulls a fast-forward.
      - name: Publish to the deploy branch
        run: |
          # Any failure is reported as an annotation with the command's own output, so it can be
          # read on the run page without digging through the log.
          report() { echo "::error title=Publish failed at: $1::$(tr '\n' ' ' < /tmp/out | tail -c 1500)"; exit 1; }
          echo "::notice title=Release size::vendor $(du -sh vendor | cut -f1), build $(du -sh public/build | cut -f1), largest file $(find vendor public/build bootstrap/ssr -type f -printf '%s %p\n' | sort -n | tail -1)"
          git config user.name "SkillLeo"
          git config user.email "hassam.dev.571@gmail.com"
          git add -f vendor public/build public/ocr public/3d storage/app/public/demo bootstrap/ssr > /tmp/out 2>&1 || report "git add"
          # The baseline as the step above left it: rebuilt when a migration was not in it, else as committed.
          git add database/baseline/testumgebung.sql > /tmp/out 2>&1 || report "git add baseline"
          # Package manifests: shipped when composer produced them; Laravel regenerates any that
          # are missing on first boot.
          for f in bootstrap/cache/packages.php bootstrap/cache/services.php; do
            if [ -f "$f" ]; then git add -f "$f" > /tmp/out 2>&1 || report "git add $f"; fi
          done
          PARENT=""
          if git fetch --quiet origin deploy > /tmp/out 2>&1; then
            PREVIOUS=$(git rev-parse FETCH_HEAD)
            PARENT="-p $PREVIOUS"
            # This token may not change workflow files on any branch, so a release carries the
            # previous release's .github/ unchanged. The host never reads it, and the workflow that
            # runs is always the one on main.
            git rm -r -q --cached .github > /tmp/out 2>&1 || report "git rm .github"
            if git cat-file -e "$PREVIOUS:.github" 2>/dev/null; then
              git read-tree --prefix=.github/ "$PREVIOUS:.github" > /tmp/out 2>&1 || report "git read-tree"
            fi
          fi
          TREE=$(git write-tree 2> /tmp/out) || report "git write-tree"
          COMMIT=$(git commit-tree "$TREE" $PARENT -m "release: $(git log -1 --format='%h %s')" 2> /tmp/out) || report "git commit-tree"
          git push origin "$COMMIT:refs/heads/deploy" > /tmp/out 2>&1 || report "git push"
          echo "::notice title=Released::$COMMIT"

  release:
    name: Post-release steps on the host
    needs: build
    if: vars.SSH_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and release over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DB_DATABASE,DB_USERNAME,DB_PASSWORD
          command_timeout: 15m
          # Fetched by URL rather than through a named remote: the host's own Git integration made
          # the clone and may have named its remote differently. The repository is public.
          # Maintenance mode FIRST, with the code that is still running, so no request ever reaches
          # new code before its migrations have run. remote.sh brings the site back up as its last
          # step; if any step fails the site stays in maintenance rather than serving half a release.
          # A first install has no vendor/ yet and nothing to take down.
          script: |
            set -e
            cd "$HOME/domains/rimify.skillleo.com/public_html"
            PHP=/opt/alt/php84/usr/bin/php
            if [ -f artisan ] && [ -f vendor/autoload.php ]; then "$PHP" artisan down --retry=60; fi
            git fetch --quiet https://github.com/${{ github.repository }}.git deploy
            git checkout -q -B deploy FETCH_HEAD
            git reset -q --hard FETCH_HEAD
            bash deploy/remote.sh
