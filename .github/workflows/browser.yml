name: Browser

# The browser suites on GitHub's machines (the operator's brief of 12.11.2026, D-460): what resume/gate.sh runs on the Mac —
# the end-to-end suite at 1440 and 390 and the phone suite — so a release no longer waits on how busy that machine is. The
# client's two lists stay on the Mac: their acceptance shop is released from his own Gutachten PDFs, which never go to git
# or to GitHub (the repository is public). One browser worker per job and no retry of Playwright's own; a test that failed only by waiting runs
# once more, alone, and is listed in the job's summary (D-458). Each job builds its machine from nothing
# (scripts/ci/browser-env.sh) on MariaDB 11.8.9 with the preview host's settings.
#
# A push to a `gate/**` branch runs it on a candidate before it goes to main; it can also be started by hand on any branch.
# With the PHP suites on both engines beside it (job `php`), that push is the release's gate but for QA and the lists (D-465).

on:
  push:
    branches: ['gate/**']
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The PHP suites on both engines the app accepts, as a release runs them (release.yml): with them a `gate/**` push is the
  # whole gate but QA and the client's two lists, which stay on the Mac (their shop is built from his own PDFs). Since
  # 13.11.2026, so a release does not wait on — or weigh on — how busy that machine is (D-465).
  php:
    name: ${{ matrix.db.engine }}
    strategy:
      fail-fast: false
      matrix:
        db:
          - engine: 'MariaDB 11.8'
            image: 'mariadb:11.8.9'
            args: '--sql-mode=NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-strict-mode=OFF --max-allowed-packet=1G'
            ping: 'healthcheck.sh --connect --innodb_initialized'
            static: true
          - engine: 'MySQL 8.4'
            image: 'mysql:8.4.9'
            args: '--log-bin-trust-function-creators=1'
            ping: 'mysqladmin ping -h 127.0.0.1 -uroot -proot --silent'
            static: false
    uses: ./.github/workflows/suite.yml
    with:
      engine: ${{ matrix.db.engine }}
      image: ${{ matrix.db.image }}
      args: ${{ matrix.db.args }}
      ping: ${{ matrix.db.ping }}
      static: ${{ matrix.db.static }}

  browser:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'E2E 1/4', key: e2e-1, config: playwright.config.ts, report: report.json, run: 'npx playwright test --shard=1/4 --reporter=list,json' }
          - { name: 'E2E 2/4', key: e2e-2, config: playwright.config.ts, report: report.json, run: 'npx playwright test --shard=2/4 --reporter=list,json' }
          - { name: 'E2E 3/4', key: e2e-3, config: playwright.config.ts, report: report.json, run: 'npx playwright test --shard=3/4 --reporter=list,json' }
          - { name: 'E2E 4/4', key: e2e-4, config: playwright.config.ts, report: report.json, run: 'npx playwright test --shard=4/4 --reporter=list,json' }
          - { name: 'Telefon', key: phone, config: tests/e2e/mobile/playwright.config.ts, report: report.json, run: 'npx playwright test -c tests/e2e/mobile/playwright.config.ts --reporter=list,json' }
    env:
      # Pest's database (tests/env.php pins everything else).
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3308
      TEST_DB_DATABASE: rimify_test
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      E2E_SHOP_DB_PORT: 3308
      # Absolute: a relative name is read from the config's folder, and the phone suite's lives in tests/e2e/mobile.
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/report.json
    steps:
      - uses: actions/checkout@v4

      - name: MariaDB 11.8.9
        run: |
          docker run -d --name db -p 3308:3306 -e MARIADB_ROOT_PASSWORD=root mariadb:11.8.9 \
            --sql-mode=NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci \
            --innodb-strict-mode=OFF --max-allowed-packet=1G
          for i in $(seq 1 60); do
            if docker exec db healthcheck.sh --connect --innodb_initialized > /dev/null 2>&1; then echo "up after ${i} s"; break; fi
            sleep 1
          done
          docker exec db healthcheck.sh --connect --innodb_initialized

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Playwright's browsers
        run: npx playwright install --with-deps chromium webkit

      - name: The machine
        run: bash scripts/ci/browser-env.sh

      - name: ${{ matrix.suite.name }}
        id: suite
        run: |
          set +e
          ${{ matrix.suite.run }}
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # D-458: a test that failed only by waiting, once more and alone; any other failure is real. Listed in the summary.
      - name: Run a wait again, alone (D-458)
        if: ${{ !cancelled() }}
        run: |
          # Always read the report, also after an exit of 0: a suite whose servers never started can end with 0 (D-460).
          rc='${{ steps.suite.outputs.rc }}'
          set +e
          node scripts/e2e/timeout-retry.mjs --config '${{ matrix.suite.config }}' --report '${{ matrix.suite.report }}' --exit "${rc:-1}" --out retry.md ${{ matrix.suite.extra }}
          code=$?
          { echo "### ${{ matrix.suite.name }}"; cat retry.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: What the run left
        if: ${{ !cancelled() && steps.suite.outputs.rc != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.suite.key }}
          path: |
            test-results/
            playwright-report/
            report.json
            retry.md
            e2e/**/*-snapshots/*-linux.png
            tests/e2e/**/*-snapshots/*-linux.png
          retention-days: 7
          if-no-files-found: ignore
