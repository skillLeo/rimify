name: Suite

# One run of the suite on one database engine, called by Checks (every push to main: MariaDB, with lint, types and
# Vitest in the same job) and by Release (a push to `release`: every engine the app accepts). One definition, so the
# everyday run and the release run cannot drift apart (D-148).
#
# The MariaDB leg starts its server with the preview host's settings — read there on 2026-09-29 as 11.8.9: a lax
# global sql_mode, utf8mb4_unicode_ci as the server's collation, innodb_strict_mode off — so what the app sets per
# session is what is tested. MySQL 8.4 is CLAUDE.md §4's engine and runs as shipped.

on:
  workflow_call:
    inputs:
      engine:
        type: string
        required: true
      image:
        type: string
        required: true
      args:
        type: string
        required: true
      ping:
        type: string
        required: true
      static:
        description: Pint, Larastan, ESLint, Stylelint, vue-tsc and Vitest in the same job, before Pest
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suite:
    name: ${{ inputs.static && format('Lint, types, Vitest, Pest on {0}', inputs.engine) || format('Pest on {0}', inputs.engine) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rimify_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Start ${{ inputs.engine }}
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root -e MYSQL_ROOT_PASSWORD=root \
            -e MARIADB_DATABASE=rimify_test -e MYSQL_DATABASE=rimify_test \
            ${{ inputs.image }} ${{ inputs.args }}
          for i in $(seq 1 60); do
            if docker exec db sh -c "${{ inputs.ping }}" > /dev/null 2>&1; then echo "up after ${i} s"; break; fi
            sleep 1
          done
          docker exec db sh -c "${{ inputs.ping }}"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Node dependencies
        run: npm ci --no-audit --no-fund

      # Every check runs even when one before it failed: one red run names everything that is wrong.
      - name: Pint
        if: ${{ inputs.static && !cancelled() }}
        run: php vendor/bin/pint --test

      - name: Larastan
        if: ${{ inputs.static && !cancelled() }}
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: ESLint and Stylelint
        if: ${{ inputs.static && !cancelled() }}
        run: |
          npm run lint
          npm run lint:css

      - name: Types (vue-tsc)
        if: ${{ inputs.static && !cancelled() }}
        run: npx vue-tsc --noEmit

      - name: Vitest
        if: ${{ inputs.static && !cancelled() }}
        run: npx vitest run

      # Pages render through Vite in the feature tests: the manifest must exist.
      - name: Client build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Environment
        if: ${{ !cancelled() }}
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: The engine the suite runs on
        if: ${{ !cancelled() }}
        run: php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root"); echo $p->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;'

      # In parallel, one process per core: each gets its own database (Laravel's parallel testing) and its own demo
      # directories (Tests\TestCase).
      - name: Pest
        if: ${{ !cancelled() }}
        run: php vendor/bin/pest --parallel --log-junit junit.xml

      # A red run names its failing tests as annotations, readable on the run page.
      - name: Failures as annotations
        if: failure()
        run: php scripts/ci/junit-annotations.php junit.xml
